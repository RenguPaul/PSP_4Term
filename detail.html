<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Viewer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="detail-wrapper">
        <div class="detail-toolbar">
            <a href="index.html" class="back-btn">← Назад к галерее</a>

            <button id="view-back">Сзади</button>

            <button id="view-right">Справа</button>
            <button id="zoom-in">+ Приблизить</button>
            <button id="zoom-out">– Отдалить</button>
        </div>
        <canvas id="detailCanvas"></canvas>
    </div>
    <script type="module" src="pages/detail/index.js"></script>
