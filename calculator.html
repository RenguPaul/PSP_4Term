<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg"></div>

    <header>
        <div class="header-inner">
            <a href="https://kubernetes.io" target="_blank" class="logo">
                <img src="https://kubernetes.io/images/favicon.png" alt="Kubernetes" class="k8s-icon">
                <span>kubernetes<span class="light">/calculator</span></span>
            </a>
            <nav>
                <a href="index.html">Главная</a>
                <a href="calculator.html" class="active">Калькулятор</a>
                <a href="about.html">О проекте</a>
            </nav>
            <a href="https://kubernetes.io" target="_blank" class="ext">kubernetes.io →</a>
        </div>
    </header>

    <main>
        <div class="calculator">
            <div id="display" class="display">0</div>
            <div class="buttons">
                <div class="row">
                    <button class="sec" data-clear>C</button>
                    <button class="sec" data-backspace>⌫</button>
                    <button class="sec" data-percent>%</button>
                    <button class="sec" data-sign>±</button>
                </div>
                <div class="row">
                    <button class="sec" data-reciprocal>1/x</button>
                    <button class="sec" data-factorial>n!</button>
                    <button class="sec" data-sqrt>√</button>
                    <button class="prim" data-op="/">/</button>
                </div>
                <div class="row">
                    <button data-digit="7">7</button>
                    <button data-digit="8">8</button>
                    <button data-digit="9">9</button>
                    <button class="prim" data-op="*">×</button>
                </div>
                <div class="row">
                    <button data-digit="4">4</button>
                    <button data-digit="5">5</button>
                    <button data-digit="6">6</button>
                    <button class="prim" data-op="-">-</button>
                </div>
                <div class="row">
                    <button data-digit="1">1</button>
                    <button data-digit="2">2</button>
                    <button data-digit="3">3</button>
                    <button class="prim" data-op="+">+</button>
                </div>
                <div class="row">
                    <button data-digit="0" class="zero">0</button>
                    <button data-digit=".">.</button>
                    <button class="prim" data-equal>=</button>
                </div>
            </div>
        </div>
    </main>

    <script src="calculator.js"></script>
    <script src="menu.js"></script>
</body>
</html>
