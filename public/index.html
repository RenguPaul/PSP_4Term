<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Style | Акции и предложения</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="k8s-header">
        <div class="logo">
            <span class="logo-icon">⎈</span>
            <span>KubeStocks</span>
        </div>
        <div class="header-links">
            <a href="#">Дашборд</a>
            <a href="#">Акции</a>
            <a href="#">Документация</a>
        </div>
    </div>

    <main class="container">
        <h1>Специальные предложения <span class="badge">CRUD API</span></h1>
        
        <!-- Форма создания -->
        <div class="card form-card">
            <h2>➕ Создать новую акцию</h2>
            <form id="stockForm">
                <input type="text" id="title" placeholder="Заголовок" required>
                <input type="text" id="src" placeholder="URL изображения" required value="https://i.pinimg.com/originals/c9/ea/65/c9ea654eb3a7398b1f702c758c1c4206.jpg">
                <textarea id="text" placeholder="Описание" rows="3" required></textarea>
                <button type="submit">🚀 Создать</button>
            </form>
        </div>

        <!-- Панель поиска -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Фильтр по заголовку...">
            <button id="searchBtn">Найти</button>
            <button id="resetBtn">Сбросить</button>
        </div>

        <!-- Сетка карточек -->
        <div id="stocksGrid" class="stocks-grid">
            <!-- карточки подгрузятся через JS -->
        </div>
    </main>

    <!-- Модальное окно для редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>✏️ Редактировать акцию</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <input type="text" id="editTitle" placeholder="Заголовок" required>
                <input type="text" id="editSrc" placeholder="URL изображения" required>
                <textarea id="editText" placeholder="Описание" rows="3" required></textarea>
                <button type="submit">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
