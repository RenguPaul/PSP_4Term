<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <header class="header">
        <h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/39/Kubernetes_logo_without_workmark.svg" 
                 alt="Kubernetes" width="36" height="36" class="k8s-logo">
            3D Gallery
        </h1>
        <div class="upload-area">
            <label for="fileInput" class="upload-btn">📁 Загрузить .glb</label>
            <input type="file" id="fileInput" accept=".glb">
        </div>
    </header>
    <main>
        <div class="gallery" id="gallery"></div>
    </main>
    <script type="module" src="main.js"></script>
</body>
</html>
